<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f8f8">
<title>Secure | DAD Sales</title>
<style>
:root{color-scheme:light;--ink:#163446;--muted:#526c77;--line:#d6e6e7;--teal:#087575;--tint:#eaf7f5;font:16px/1.6 Almarai,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f3f8f8;color:var(--ink)}
main{width:min(1120px,calc(100% - 28px));margin:clamp(14px,5vw,48px) auto}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:clamp(18px,4vw,32px);background:#123847;color:#fff;border-radius:22px}
h1{margin:0;font-size:clamp(28px,5vw,42px);line-height:1.1}header p{margin:7px 0 0;color:#d1edeb;font-size:14px}
a{color:var(--teal);text-underline-offset:4px}header a{color:#e0fbf7;font-size:14px}
.tools,.person{background:white;border:1px solid var(--line);border-radius:16px}
.tools{margin:14px 0;padding:16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
button,input{font:inherit}button{cursor:pointer;border:1px solid #cce4e2;border-radius:9px;background:var(--tint);color:var(--teal);font-size:13px;font-weight:700;padding:7px 10px;min-height:40px;white-space:nowrap}
#refresh{background:var(--teal);color:white}button:disabled{opacity:.55;cursor:default}
button:hover{border-color:var(--teal)}:focus-visible{outline:2px solid #099999;outline-offset:3px}
input[type=search]{flex:1 1 220px;min-width:0;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;color:var(--ink)}
#count,#status{font-size:14px;color:var(--muted)}#status{min-height:1.6em;margin:10px 3px}
#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
h2{line-height:1.4;margin:0;overflow-wrap:anywhere}

#results{grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:16px}
.person{--card-ink:#15544e;--card-base:#e1f4ee;--card-light:#f4fbf8;--card-line:#b9dfd3;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:146px;padding:18px;border-radius:19px;border:1px solid var(--card-line);background:linear-gradient(145deg,var(--card-light),var(--card-base));color:var(--card-ink);box-shadow:0 8px 20px #1738440b;transition:transform .18s ease,box-shadow .18s ease}
.person[data-tone="1"]{--card-ink:#274f79;--card-base:#e2effb;--card-light:#f6faff;--card-line:#c5dcef}
.person[data-tone="2"]{--card-ink:#65446e;--card-base:#f0e6f4;--card-light:#fcf8fd;--card-line:#e3cde9}
.person[data-tone="3"]{--card-ink:#744b27;--card-base:#faead8;--card-light:#fffbf4;--card-line:#edd2b2}
.person[data-tone="4"]{--card-ink:#456237;--card-base:#e9f1dc;--card-light:#f8fbf1;--card-line:#d1e1ba}
.person[data-tone="5"]{--card-ink:#793f50;--card-base:#f8e5eb;--card-light:#fff8fa;--card-line:#edcbd7}
.person::before{position:absolute;z-index:-1;inset-inline-end:-40px;top:-58px;width:146px;height:146px;border:1px solid var(--card-line);border-radius:50%;box-shadow:0 0 0 14px #ffffff40,0 0 0 29px #ffffff30;content:"";pointer-events:none}
.person:hover,.person:focus-within{transform:translateY(-3px);box-shadow:0 14px 24px #17384418}
.person-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0}
.person h2{font-size:17px;color:var(--card-ink)}
.person .hide-card{min-height:44px;background:#ffffff9e;border-color:var(--card-line);color:var(--card-ink)}
.person .copy-message{width:100%;margin:0;min-height:44px;border-color:var(--card-ink);background:var(--card-ink);color:white;transition:filter .18s ease}
.person .copy-message:hover{filter:brightness(1.14)}
#hidden-toggle[aria-pressed="true"]{background:var(--teal);color:white}
@media(prefers-reduced-motion:reduce){.person,.person .copy-message{transition:none}.person:hover,.person:focus-within{transform:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 dir="ltr">Secure</h1><p>رسائل تفعيل برنامج المبيعات</p></div>
    <a href="https://github.com/BaselGhanem/DAD_Sales/blob/main/credentials.csv" target="_blank" rel="noopener noreferrer" dir="ltr">credentials.csv</a>
  </header>
  <section class="tools" aria-label="تحميل وبحث">
    <button id="refresh" type="button">تحديث البيانات</button>
    <input id="search" type="search" placeholder="ابحث بالاسم" aria-label="بحث" hidden>
    <button id="hidden-toggle" type="button" aria-pressed="false" hidden></button>
    <span id="count"></span>
  </section>
  <p id="status" role="status">جاري تحميل الحسابات من GitHub</p>
  <div id="results"></div>
</main>
<script>
const fields = [
  [`Username`, `اسم المستخدم`],
  [`Medical Representative`, `الاسم`],
  [`PIN`, `رمز الدخول`],
  [`Role`, `الدور`],
  [`Team`, `الفريق`]
];
const byId = id => document.getElementById(id);
const refresh = byId(`refresh`);
const source = `https://raw.githubusercontent.com/BaselGhanem/DAD_Sales/main/credentials.csv`;
const search = byId(`search`);
const results = byId(`results`);
const status = byId(`status`);
const hiddenToggle = byId(`hidden-toggle`);
const storageKey = `dad-sales-secure-hidden-v1`;
let users = [];
let showHidden = false;
let hiddenUsers = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || `[]`);
  if (Array.isArray(saved)) hiddenUsers = new Set(saved.filter(value => typeof value === `string`));
} catch { /* Keep the page usable when storage is unavailable. */ }

function parseCSV(source) {
  const text = source.replace(/^\uFEFF/, ``);
  const rows = [];
  let row = [];
  let cell = ``;
  let quoted = false;
  function pushRow() {
    row.push(cell);
    if (row.some(value => value.trim())) rows.push(row);
    row = [];
    cell = ``;
  }
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === `"`) {
      if (quoted && text[i + 1] === `"`) {
        cell += char;
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (!quoted && char === `,`) {
      row.push(cell);
      cell = ``;
    } else if (!quoted && (char === `\r` || char === `\n`)) {
      if (char === `\r` && text[i + 1] === `\n`) i++;
      pushRow();
    } else {
      cell += char;
    }
  }
  if (quoted) throw new Error(`في علامة اقتباس غير مغلقة في الملف`);
  pushRow();
  const headers = (rows.shift() || []).map(value => value.trim());
  const required = fields.slice(0, 3).map(([key]) => key);
  if (!required.every(key => headers.includes(key))) {
    throw new Error(`الملف لازم يحتوي على Username وMedical Representative وPIN`);
  }
  return rows.map(values => Object.fromEntries(
    fields.map(([key]) => [key, values[headers.indexOf(key)]?.trim() ?? ``])
  ));
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function copyButton(label, value, accessibleName) {
  const button = element(`button`, label);
  button.type = `button`;
  button.setAttribute(`aria-label`, accessibleName);
  button.disabled = !value;
  button.addEventListener(`click`, async () => {
    try {
      await navigator.clipboard.writeText(value);
      status.textContent = `تم نسخ رسالة التفعيل`;
      button.textContent = `تم النسخ ✓`;
    } catch {
      status.textContent = `النسخ ما اشتغل، تاكد من اذن الحافظة في المتصفح`;
    }
  });
  return button;
}

function render() {
  const query = search.value.trim().toLocaleLowerCase();
  const hiddenCount = users.filter(user => hiddenUsers.has(user.Username)).length;
  if (!hiddenCount) showHidden = false;
  hiddenToggle.hidden = !hiddenCount;
  hiddenToggle.textContent = showHidden ? `العودة للبطاقات الظاهرة` : `المخفية (${hiddenCount})`;
  hiddenToggle.setAttribute(`aria-pressed`, String(showHidden));
  const visible = users.map((user, index) => ({user, index})).filter(({user}) =>
    hiddenUsers.has(user.Username) === showHidden &&
    user[`Medical Representative`].toLocaleLowerCase().includes(query));
  const cards = document.createDocumentFragment();
  for (const {user, index} of visible) {
    const name = user[`Medical Representative`] || `—`;
    const card = element(`article`, undefined, `person`);
    card.dataset.tone = String(index % 6);
    const header = element(`div`, undefined, `person-head`);
    const visibility = element(`button`, showHidden ? `استرجاع` : `اخفاء`, `hide-card`);
    visibility.type = `button`;
    visibility.setAttribute(`aria-label`, `${visibility.textContent} بطاقة ${name}`);
    visibility.disabled = !user.Username;
    visibility.addEventListener(`click`, () => {
      if (showHidden) hiddenUsers.delete(user.Username);
      else hiddenUsers.add(user.Username);
      try {
        localStorage.setItem(storageKey, JSON.stringify([...hiddenUsers]));
        status.textContent = showHidden ? `تم استرجاع البطاقة` : `تم اخفاء البطاقة`;
      } catch {
        status.textContent = `تعذر حفظ حالة البطاقة بعد اغلاق الصفحة`;
      }
      render();
    });
    header.append(element(`h2`, name), visibility);
    const message = user.Username && user.PIN ? [
      `السلام عليكم سيد/ة ${name}، كيفك؟`,
      `تم تفعيل برنامج DAD Sales لمتابعة المبيعات`,
      `اسم المستخدم: ${user.Username}\nرمز الدخول: ${user.PIN}`,
      `رابط الدخول\nhttps://baselghanem.github.io/DAD_Sales/`,
      `اعتبارا من وقت وصول هاي الرسالة، رح يتوقف ارسال تقرير الاكسل اليومي، وبتقدر تتابع مبيعاتك من خلال البرنامج`
    ].join(`\n\n`) : ``;
    const button = copyButton(`Copy`, message, `نسخ رسالة التفعيل لحساب ${name}`);
    button.classList.add(`copy-message`);
    card.append(header, button);
    cards.append(card);
  }
  results.replaceChildren(cards);
  byId(`count`).textContent = users.length ? `${visible.length} / ${users.length} حساب` : ``;
}

async function loadAccounts() {
  refresh.disabled = true;
  status.textContent = `جاري تحميل الحسابات من GitHub`;
  try {
    const response = await fetch(source, {cache: `no-store`, credentials: `omit`});
    if (!response.ok) throw new Error(`GitHub ${response.status}`);
    users = parseCSV(await response.text());
    search.hidden = !users.length;
    render();
    status.textContent = users.length ? `اضغط Copy تحت بطاقة الشخص` : `الملف ما فيه حسابات`;
  } catch {
    status.textContent = users.length
      ? `تعذر التحديث من GitHub، البيانات المعروضة من اخر تحميل ناجح`
      : `تعذر تحميل الحسابات من GitHub، جرب زر تحديث البيانات`;
  } finally {
    refresh.disabled = false;
  }
}

hiddenToggle.addEventListener(`click`, () => {
  showHidden = !showHidden;
  search.value = ``;
  render();
});
search.addEventListener(`input`, render);
refresh.addEventListener(`click`, loadAccounts);
loadAccounts();
</script>
</body>
</html>
