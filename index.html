<div id="app" class="shell" inert>
<header><div class="brand"><h1>Sales portal</h1><span>DAD SALES PORTAL</span></div><img src="https://www.dadgroup.com/wp-content/uploads/2023/11/uplift-dad-website-05.png" alt="Dar Al-Dawaa" class="logo"></header>
<main><section id="roles"><div class="eyebrow">DAR AL-DAWAA</div><h2>Welcome to your sales portal</h2><p class="subtitle">Choose your account type to continue</p><div class="role-grid">
<button class="role-card" data-role="rep"><img src="https://baselghanem.github.io/OrderingSystem/assets/role-representative.webp" alt="" width="150" height="150"><strong>Medical representative</strong><span>Medical Representative</span></button>

<button class="role-card" data-role="chronic"><img src="assets/Hijabi%20Businesswoman%20and%20Growth%20Chart.webp" alt="" width="150" height="150"><strong lang="en" dir="ltr">Business Unit<br>Chronic</strong><span>Chronic business unit</span></button>
<button class="role-card" data-role="anti-infective"><img src="https://baselghanem.github.io/OrderingSystem/assets/role-manager.webp" alt="" width="150" height="150"><strong lang="en" dir="ltr">Business Unit<br>Anti Infective</strong><span>Anti-infective business unit</span></button>
</div></section>
<section id="auth" hidden><button id="back" class="back" type="button">Back to account types</button><div class="auth-card"><div class="eyebrow">Sales portal</div><h2 id="auth-title">Sign in</h2><form id="login"><label for="username">Username</label><select id="username" name="username" autocomplete="username" required><option value="">Select your name</option></select><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" minlength="4" pattern="[0-9\u0660-\u0669\u06f0-\u06f9]{4}" placeholder="Enter your password" required><button id="toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><label class="remember"><input id="remember" type="checkbox">Remember me</label><p id="message" role="status" aria-live="polite"></p><button id="submit" class="primary" type="submit">Sign in</button></form></div></section>

<footer><span>Dar Al-Dawaa</span><span lang="en">DAD Sales · 2026</span></footer></main></div><noscript>Please enable JavaScript to use the sales portal</noscript></body></html>
